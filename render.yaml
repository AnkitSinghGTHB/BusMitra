services:
  - type: web
    name: busmitra-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: busmitra-db
          property: connectionString
      - key: ML_SERVICE_URL
        value: http://busmitra-ml:8000
      - key: NODE_ENV
        value: production

  - type: web
    name: busmitra-ml
    env: docker
    dockerContext: .
    dockerfilePath: ml-service/Dockerfile
    envVars:
      - key: PORT
        value: "8000"

databases:
  - name: busmitra-db
    databaseName: busmitra
    user: busmitra_user
